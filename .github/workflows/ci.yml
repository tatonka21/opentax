name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck scripts/*.sh
          else
            sudo apt-get update -y && sudo apt-get install -y shellcheck
            shellcheck scripts/*.sh
          fi

  terraform:
    name: Validate Terraform (Oracle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/oracle
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  compose:
    name: Validate compose overrides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Lint override file
        run: docker compose -f infra/docker-compose.overrides.yml config --quiet
