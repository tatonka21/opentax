name: Build OpenDAX images

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated list to build (peatio,barong,rango,baseapp,tower)"
        required: false
        default: "peatio,barong,rango,baseapp,tower"
      platforms:
        description: "Build platforms"
        required: false
        default: "linux/amd64,linux/arm64"
  push:
    branches: [main]
    paths:
      - "infra/images/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      IMAGES: ${{ inputs.images || 'peatio,barong,rango,baseapp,tower' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: peatio
            repo: openware/peatio
            ref: 2.6.48
          - name: barong
            repo: openware/barong
            ref: 2.6.44
          - name: rango
            repo: openware/rango
            ref: 2.6.1
          - name: baseapp
            repo: openware/baseapp
            ref: 2.6.24
          - name: tower
            repo: openware/tower
            ref: 2.6.66
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: src

      - name: Build and push
        if: contains(env.IMAGES, matrix.name)
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opentax-${{ matrix.name }}:${{ matrix.ref }}
            ghcr.io/${{ github.repository_owner }}/opentax-${{ matrix.name }}:latest
          cache-from: type=gha,scope=opentax-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=opentax-${{ matrix.name }}
